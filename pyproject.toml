[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-lints"
version = "0.15.0"
description = "Python linting rules for optimised AI agent development"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "pathspec>=0.12.1",
]

[project.scripts]
ml-lints = "ml_lints.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_lints"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.17.3",
    "ty>=0.0.94",
]

# ruff and ty config lives in ruff.toml and ty.toml beside this file, not here -- see
# fleet's ar-vlz. ruff.toml extends the fleet's shared ruff_shared.toml (synced by
# fleet) and adds this repo's own extras; its target-version follows the fleet's Python floor,
# which requires-python also states. ty.toml is the fleet's shared file
# verbatim. A [tool.ruff]/[tool.ty] table here would be silently overridden and dead.

[tool.pytest.ini_options]
addopts = "-n auto --dist=worksteal"
testpaths = ["tests"]

[tool.ml-lints]
# tests/ deliberately contains fixtures that violate ML500/ML501 -- that's the point of
# the test suite for those rules, not something to fix. See `just extra-lints`.
# .fleet/ holds files fleet delivers and lints at its source, at the fleet's Python floor,
# so linting them again here adds nothing and can fail on a repo pinned below that floor.
# A fleet requirement, enforced by .fleet/lint/check_lint_config.py.
extend-exclude = ["tests", ".fleet"]

