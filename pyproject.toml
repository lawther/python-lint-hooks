[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-lint-hooks"
version = "0.7.2"
description = "Custom Python linting rules."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pathspec>=0.12.1",
]

[project.scripts]
ml-lint = "python_lint_hooks.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/python_lint_hooks"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    "ruff>=0.11",
    "ty>=0.0.1a14",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
external = ["ML"]
select = [
    "B",
    "C4",
    "D",
    "DTZ",
    "E",
    "F",
    "I",
    "S",
    "ICN",
    "PGH",
    "PL",
    "RUF",
    "UP",
    "ANN",
    "ASYNC",
    "SIM",
    "LOG",
]
ignore = [
    "D100",  # missing docstring in public module
    "D101",  # missing docstring in public class
    "D102",  # missing docstring in public method
    "D103",  # missing docstring in public function
    "D104",  # missing docstring in public package
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PLC0415", "PLR2004", "PGH003"]
"tests/**" = ["RUF003"]
"src/**" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
